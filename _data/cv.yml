cv:
  name: Christian Vedel
  email: christian-vs@sam.sdu.dk
  website: https://christianvedels.github.io
  location: "Odense, Denmark"
  summary: >-
    What drives all of my research is a simple premise: much of what we know
    about the economic cosmos is limited by what we can measure. I build machine
    learning tools and large-scale historical datasets to recover economic
    measurements from the past, and combine them with causal inference methods
    to study how geography and institutions shape prosperity. The ultimate aim
    is to use the vastness of history to give policy makers better maps of what
    can be changed, what cannot, and where the limits of policy lie. **Keywords:**
    Economic history, economic development, causal inference, machine learning,
    economic geography, large-scale historical data.

